[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycoder-harness"
version = "0.1.0"
description = "MyCoder — 本地 Coding Agent Harness(面向代码仓库长链路任务的本地 Agent 运行底座)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MyCoder Dev" }]
keywords = ["agent", "harness", "tool-calling", "context-management", "checkpoint", "memory", "llm"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 本地 OpenAI 兼容后端可选依赖(用标准库 urllib 亦可,不强制 requests)
http = ["requests>=2.31"]
# 评测与测试依赖
test = ["pytest>=8.0", "pytest-cov>=5.0"]
# 代码质量工具(dev)
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.10"]
# FastAPI API 服务(可选,启动时需装)
api = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27"]
# 向量记忆检索(可选,默认使用零依赖哈希嵌入器)
vector = ["fastembed>=0.3"]
# OpenTelemetry 可观测性(可选)
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]

[project.scripts]
mycoder = "mycoder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mycoder*"]

[tool.setuptools.package-data]
"mycoder.api" = ["static/*.js"]   # vendored Vue 3 运行时(离线监控页用)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "layer_regression: Layer-1 harness 回归测试",
    "layer_context: Layer-2 上下文治理评测",
    "layer_memory: Layer-3 记忆收益评测",
    "layer_resume: Layer-4 恢复正确性评测",
    "layer_retrieval: Layer-5 检索召回评测",
]

[tool.coverage.run]
source = ["mycoder"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.ruff]
line-length = 110
target-version = "py310"
# 示例/生成脚本不参与 lint(giant_test.py 为约 4669 行的生成产物)
# conda 环境目录(项目内置 .conda 与 CI 复刻用 .conda-*)不参与 lint
exclude = ["examples", "generate_test_file.py", ".conda", ".conda-*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "RUF003", # ambiguous-unicode-character: Chinese comments use fullwidth punctuation
    "RUF001", # ambiguous-character: 测试数据/生成脚本中的中文全角标点是有意的
    "RUF002", # ambiguous-docstring: 文档中的数学符号 α/β 是刻意的
]

[tool.ruff.lint.per-file-ignores]
"mycoder/api/monitor_page.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["mycoder", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# 以下配置为代码库的合理让步:工具子类用不同默认参数重写 execute,
# **kwargs 是故意的;yaml 没有 typeshed stubs。
disable_error_code = [
    "override",
    "import-untyped",
    "no-any-unimported",
]